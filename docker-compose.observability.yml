name: village-service-observability

services:
  loki:
    image: grafana/loki:3.7.2
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./storage/logs:/var/log/village-service:ro
      - alloy-data:/var/lib/alloy/data

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    depends_on:
      - loki
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://127.0.0.1:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  alloy-data:
  grafana-data:
  loki-data:
